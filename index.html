<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Workout Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gym Workout Tracker</h1>
        <p>Track your workouts and monitor your progress.</p>
    </header>

    <main>

        <section class="dashboard">
            <div class="card">
                <h3>Workouts</h3>
                <p class="number">12</p>
                <span>This month</span>
            </div>

            <div class="card">
                <h3>Total Exercises</h3>
                <p class="number">36</p>
                <span>Completed</span>
            </div>

            <div class="card">
                <h3>Workout Streak</h3>
                <p class="number">5</p>
                <span>Days</span>
            </div>
        </section>


        <section class="workout-form">

            <h2>Add Workout</h2>

            <form>

                <label for="date">Date</label>
                <input type="date" id="date">

                <label for="exercise">Exercise</label>
                <input type="text" id="exercise" placeholder="e.g. Squats">

                <label for="sets">Sets</label>
                <input type="number" id="sets" placeholder="e.g. 3">

                <label for="reps">Reps</label>
                <input type="number" id="reps" placeholder="e.g. 10">

                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 20">

                <button type="submit">Add Workout</button>

            </form>

        </section>


        <section class="history">

            <h2>Workout History</h2>

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Exercise</th>
                        <th>Sets</th>
                        <th>Reps</th>
                        <th>Weight</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
    <td>09/24/2026</td>
    <td>Squats</td>
    <td>3</td>
    <td>10</td>
    <td>20 kg</td>
    <td><button class="delete-btn" type="button">Delete</button></td>
</tr>
                   <tr>
    <td>09/23/2026</td>
    <td>Hip Thrust</td>
    <td>4</td>
    <td>12</td>
    <td>30 kg</td>
    <td><button class="delete-btn" type="button">Delete</button></td>
</tr>

                </tbody>

            </table>

        </section>

    </main>
<script src="script.js"></script>

</body>
</html>
